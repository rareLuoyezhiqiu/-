<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f7">
  <meta name="description" content="随手记下想法，留给之后的自己。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <title>灵感清单</title>
</head>
<body>
  <header class="site-header"><a class="brand" href="/">灵感清单<span class="brand-dot" aria-hidden="true"></span></a></header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div><p class="today" id="today"></p><h1 id="page-title">让想法，有个落脚点。</h1><p class="subtitle">不必完整，先记下来。</p></div>
      <button class="primary new-button" id="new"><span aria-hidden="true">＋</span> 记一下</button>
    </section>
    <button id="resume" class="draft-banner" hidden>有一段还没写完的想法<span>继续写 →</span></button>
    <section class="collection" aria-label="所有想法">
      <div class="list-heading"><h2>我的想法 <span id="count"></span></h2><span>最近记录在前</span></div>
      <div id="list"></div>
      <div id="empty" class="empty" hidden><span class="empty-mark" aria-hidden="true">＋</span><h2>第一条想法，留给此刻。</h2><p>一句话也好，一个还没成形的念头也好。</p><button id="empty-new" class="text-button">记下第一个想法 →</button></div>
    </section>
    <footer><span class="local-dot" aria-hidden="true"></span>体验版 · 仅保存在当前浏览器</footer>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form">
      <div class="sheet-header"><h2 id="editor-title">记下此刻的想法</h2><button type="button" id="close" class="text-button">收起</button></div>
      <label for="content" class="sr-only">想法内容</label>
      <textarea id="content" placeholder="刚刚，你想到了什么？" spellcheck="false"></textarea>
      <p id="save-error" class="error" role="alert" hidden></p>
      <div class="sheet-footer"><span id="draft-status" aria-live="polite">不必想好标题，一句话就可以。</span><button id="save" class="primary" type="submit" disabled>保存想法</button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog" class="confirm" aria-labelledby="delete-title">
    <h2 id="delete-title">删除这条想法？</h2><p>删除后将无法恢复。</p>
    <div class="confirm-actions"><button id="cancel-delete" class="secondary">保留想法</button><button id="confirm-delete" class="danger">确认删除</button></div>
  </dialog>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
